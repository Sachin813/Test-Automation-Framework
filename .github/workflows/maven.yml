name: Test Automation Workflow

on:
  schedule:
  - cron: '00 18 * * *' 
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Run Tests
      run: mvn clean test -Dbrowser=chrome -DisLambdaTest=true -DisHeadless=false

    - name: Upload Test logs
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
        name: Test logs
        path: logs/


    - name: Upload Test Reports
      if: always() 
      uses: actions/upload-artifact@v4.4.3
      with:
        name: Test Reports
        path: SmokeReport/   

    - name: Test Execution Status
      run: echo "Test Execution Completed"
    
    - name: Copy Report to gh-pages Folder
      if: always()

      run: |
        mkdir -p public/extent-reports
        cp -R SmokeReport/report.html public/extent-reports/
        cp -R screenshots/ public/extent-reports/screenshots/
        ls -l

    - name: Deploy 🚀
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: SmokeReport/report.html public/extent-reports/
        token: ${{ secrets.PAT1234 }}
        clean: true
